name: Sync Upstream v2

# Upstream sync workflow (post-restructure 2-branch layout).
#
# Branches:
#   dev      — mirror of upstream/dev. Contains zero fork commits. Advances by
#              fast-forward only, so upstream sync is guaranteed conflict-free.
#   release  — dev + fork customizations. Build target. Rebased onto dev
#              whenever dev advances.
#
# This workflow:
#   1. Fetches upstream/dev and fast-forwards local dev to it, then pushes dev.
#   2. Rebases release onto the new dev on a temporary worktree:
#      - Success: force-with-lease push release directly. Build-custom takes
#        over from there and produces the new binary artifact.
#      - Conflict: push the conflict state to a dedicated
#        sync/release-rebase-<date>-<sha> branch and open a draft PR
#        (base=release) so the maintainer can resolve locally.
#   dev is never touched on failure.

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mon and Thu at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not push dev/release or open PRs. Useful for validation."
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create upstream-sync --color 0e8a16 \
            --description "Automated upstream sync PRs and issues" 2>/dev/null || true
          gh label create sync-blocked --color d93f0b \
            --description "Upstream sync conflict requires manual resolution" 2>/dev/null || true

      - name: Fetch upstream and dev
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          git fetch origin dev

      - name: Determine sync window
        id: meta
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          DEV_SHA=$(git rev-parse origin/dev)
          RELEASE_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHORT=${UPSTREAM_SHA:0:7}
          DEV_BEHIND=$(git rev-list --count origin/dev..upstream/dev)
          TODAY=$(date -u +%Y%m%d)
          SYNC_BRANCH="sync/release-rebase-${TODAY}-${UPSTREAM_SHORT}"
          {
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "upstream_short=$UPSTREAM_SHORT"
            echo "dev_sha=$DEV_SHA"
            echo "release_sha=$RELEASE_SHA"
            echo "dev_behind=$DEV_BEHIND"
            echo "sync_branch=$SYNC_BRANCH"
          } >> $GITHUB_OUTPUT
          echo "dev is ${DEV_BEHIND} commit(s) behind upstream/dev (${UPSTREAM_SHORT})."

      - name: Skip when already up to date
        if: steps.meta.outputs.dev_behind == '0'
        run: |
          echo "dev is already at upstream/dev. Nothing to sync."
          exit 0

      - name: Verify dev can fast-forward to upstream/dev
        if: steps.meta.outputs.dev_behind != '0'
        run: |
          # dev must be an ancestor of upstream/dev. If dev has commits upstream
          # doesn't, the mirror has drifted — fail loudly rather than rewrite.
          if ! git merge-base --is-ancestor origin/dev upstream/dev; then
            echo "::error::origin/dev has commits not present in upstream/dev — mirror has drifted."
            echo "Local ahead commits:"
            git log --oneline upstream/dev..origin/dev
            exit 1
          fi

      - name: Fast-forward dev to upstream/dev
        if: steps.meta.outputs.dev_behind != '0' && inputs.dry_run != true
        run: |
          # Push dev directly to upstream's current commit. Fast-forward only,
          # force-with-lease protects against races with other pushes.
          git push origin "${{ steps.meta.outputs.upstream_sha }}:refs/heads/dev" \
            --force-with-lease="dev:${{ steps.meta.outputs.dev_sha }}"

      - name: Rebase release onto upstream/dev (on a worktree)
        if: steps.meta.outputs.dev_behind != '0'
        id: rebase
        continue-on-error: true
        shell: bash
        run: |
          # Use a worktree so the rebase state stays isolated from the main
          # checkout (release). On failure we push a snapshot branch from the
          # worktree without affecting anything else.
          git worktree add --detach /tmp/release-rebase HEAD
          cd /tmp/release-rebase
          set +e
          set -o pipefail
          git rebase "${{ steps.meta.outputs.upstream_sha }}" 2>&1 | tee /tmp/rebase.log
          RC=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            NEW_SHA=$(git rev-parse HEAD)
            echo "new_release_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          else
            echo "status=conflict" >> $GITHUB_OUTPUT
            git diff --name-only --diff-filter=U > /tmp/conflict-files.txt || true
            git rebase --abort || true
          fi

      # ---- SUCCESS PATH ----

      - name: Force-with-lease push release
        if: steps.rebase.outputs.status == 'success' && inputs.dry_run != true
        run: |
          cd /tmp/release-rebase
          # Use the pre-rebase release SHA as the lease guard so a concurrent
          # release push doesn't get clobbered.
          git push origin HEAD:refs/heads/release \
            --force-with-lease="release:${{ steps.meta.outputs.release_sha }}"
          echo "release advanced to ${{ steps.rebase.outputs.new_release_sha }} — build-custom will pick it up."

      # ---- CONFLICT PATH ----

      - name: Push conflict snapshot branch
        if: steps.rebase.outputs.status == 'conflict' && inputs.dry_run != true
        run: |
          # Worktree is back at pre-rebase release HEAD after abort. Reset it
          # to upstream/dev so the PR shows the upstream commits that release
          # must absorb. The maintainer resolves the rebase locally and
          # force-pushes to release.
          cd /tmp/release-rebase
          git reset --hard "${{ steps.meta.outputs.upstream_sha }}"
          git push origin "HEAD:refs/heads/${{ steps.meta.outputs.sync_branch }}" --force

      - name: Open draft PR (conflict)
        if: steps.rebase.outputs.status == 'conflict' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SYNC_BRANCH: ${{ steps.meta.outputs.sync_branch }}
          UPSTREAM_SHORT: ${{ steps.meta.outputs.upstream_short }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.upstream_sha }}
          DEV_BEHIND: ${{ steps.meta.outputs.dev_behind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CONFLICTS=$(cat /tmp/conflict-files.txt 2>/dev/null | sed 's/^/- /' || echo "_none captured_")
          LOG_TAIL=$(tail -n 80 /tmp/rebase.log 2>/dev/null || echo "log unavailable")

          BODY=$(cat <<EOF
          ## :rotating_light: release rebase blocked

          \`dev\` was fast-forwarded to upstream \`${UPSTREAM_SHORT}\` (${DEV_BEHIND} new commit(s)), but rebasing \`release\` onto it hit conflicts.

          - Upstream commit: [\`${UPSTREAM_SHORT}\`](https://github.com/anomalyco/opencode/commit/${UPSTREAM_SHA})
          - Workflow run: ${RUN_URL}
          - Branch \`${SYNC_BRANCH}\` is at \`upstream/dev\` — it surfaces the upstream delta that conflicts with release customizations.

          ### Conflicting files
          ${CONFLICTS}

          ### Rebase log (tail)
          \`\`\`
          ${LOG_TAIL}
          \`\`\`

          ### Manual resolution
          \`\`\`bash
          git fetch origin
          git checkout release
          git rebase origin/dev
          # resolve conflicts, git add, git rebase --continue
          git push origin release --force-with-lease
          # close this PR (it was only a notice — the resolved release is elsewhere)
          \`\`\`
          EOF
          )

          gh pr create \
            --draft \
            --base release \
            --head "$SYNC_BRANCH" \
            --title "[BLOCKED] release rebase conflict on ${UPSTREAM_SHORT}" \
            --body "$BODY" \
            --label upstream-sync \
            --label sync-blocked || true

      - name: Cleanup worktree
        if: always() && steps.rebase.outcome != 'skipped'
        run: |
          git worktree remove --force /tmp/release-rebase 2>/dev/null || true

      # ---- DRY-RUN REPORT ----

      - name: Dry-run summary
        if: inputs.dry_run == true && steps.meta.outputs.dev_behind != '0'
        env:
          UPSTREAM_SHORT: ${{ steps.meta.outputs.upstream_short }}
          DEV_BEHIND: ${{ steps.meta.outputs.dev_behind }}
          REBASE_STATUS: ${{ steps.rebase.outputs.status }}
          SYNC_BRANCH: ${{ steps.meta.outputs.sync_branch }}
        shell: bash
        run: |
          {
            echo "### Dry run — no push, no PR"
            echo ""
            echo "- Upstream commit: \`${UPSTREAM_SHORT}\`"
            echo "- dev behind by: ${DEV_BEHIND} commit(s)"
            echo "- Rebase of release onto upstream/dev: **${REBASE_STATUS}**"
            echo "- Sync branch that would be used on conflict: \`${SYNC_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
